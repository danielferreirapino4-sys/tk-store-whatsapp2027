services:
  - type: web
    name: tk-store-painel
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: PANEL_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /data
      - key: SHOP_URL
        value: https://tkplaytv.tkplaytv9.chatgpt.site/
    disk:
      name: tk-store-painel-data
      mountPath: /data
      sizeGB: 1
